name: CI Pipeline

# When to run this workflow
on:
  push:
    branches: [ main, develop, CICD ]  # Run on pushes to these branches
  pull_request:
    branches: [ main, develop ]        # Run on PRs to these branches

# Define the jobs to run
jobs:
  # Job 1: Backend Testing
  backend-tests:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest  # Use Ubuntu virtual machine
    
    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # Step 3: Cache dependencies (faster builds)
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      # Step 4: Install dependencies
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black
      
      # Step 5: Run linting
      - name: Lint with flake8
        working-directory: ./backend
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      
      # Step 6: Check code formatting
      - name: Check code formatting with black
        working-directory: ./backend
        run: |
          black --check .
      
      # Step 7: Run tests
      - name: Run tests with pytest
        working-directory: ./backend
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing
      
      # Step 8: Upload coverage report
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # Job 2: Frontend Testing
  frontend-tests:
    name: Frontend Tests & Linting
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Node.js
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci  # Use 'ci' for faster, deterministic installs
      
      # Step 4: Run linting
      - name: Lint with ESLint
        working-directory: ./frontend
        run: npm run lint
      
      # Step 5: Check code formatting
      - name: Check formatting with Prettier
        working-directory: ./frontend
        run: npx prettier --check .
      
      # Step 6: Run tests
      - name: Run tests with Jest
        working-directory: ./frontend
        run: npm test -- --coverage --passWithNoTests
      
      # Step 7: Upload coverage report
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  # Job 3: Build Check (ensures code compiles)
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]  # Only run if tests pass
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Check build size
        working-directory: ./frontend
        run: |
          echo "Build completed successfully!"
          du -sh .next
