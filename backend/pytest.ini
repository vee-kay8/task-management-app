# ============================================================
# PYTEST CONFIGURATION
# ============================================================
# This file configures how pytest discovers and runs tests
# Documentation: https://docs.pytest.org/en/latest/reference/customize.html

[pytest]
# ============================================================
# TEST DISCOVERY
# ============================================================
# testpaths: Where pytest should look for tests
# pytest will only search in these directories
testpaths = tests

# python_files: Pattern for test file names
# Files must start with "test_" to be discovered
# Example: test_models.py, test_auth.py ✓
# Example: models_test.py ✗ (won't be discovered)
python_files = test_*.py

# python_classes: Pattern for test class names
# Classes must start with "Test" to be discovered
# Example: TestUserModel, TestAuthentication ✓
# Example: UserTests ✗ (won't be discovered)
python_classes = Test*

# python_functions: Pattern for test function names
# Functions must start with "test_" to be discovered
# Example: test_user_creation, test_login ✓
# Example: check_password ✗ (won't be a test)
python_functions = test_*

# ============================================================
# OUTPUT AND REPORTING
# ============================================================
# addopts: Additional command-line options always applied
# These run every time you type "pytest"

addopts =
    # -v: Verbose output (shows each test name as it runs)
    # Instead of: "tests/test_models.py ."
    # You get: "tests/test_models.py::TestUserModel::test_creation PASSED"
    -v
    
    # -ra: Show summary of all test results at the end
    # r = report, a = all (passed, failed, skipped, errors)
    -ra
    
    # --strict-markers: Fail if using undefined markers
    # Prevents typos like @pytest.mark.slwo instead of @pytest.mark.slow
    --strict-markers
    
    # --tb=short: Shorter traceback format
    # Shows error location without full code context
    # Options: long, short, line, native, no
    --tb=short
    
    # ============================================================
    # CODE COVERAGE OPTIONS
    # ============================================================
    # --cov=app: Measure coverage for the "app" directory
    # This is your application code (not tests)
    --cov=app
    
    # --cov-report=term-missing: Show uncovered lines in terminal
    # Output example:
    # Name                Stmts   Miss  Cover   Missing
    # app/models/user.py     45      3    93%   23, 67-68
    #                                            ^^^^^^^^^ These lines not tested
    --cov-report=term-missing
    
    # --cov-report=html: Generate HTML coverage report
    # Creates htmlcov/index.html - open in browser to see visual report
    # Green = covered, Red = not covered
    --cov-report=html
    
    # --cov-fail-under=0: Don't fail if coverage is below this %
    # Set to 80 once you have good test coverage
    # --cov-fail-under=80 means "fail if coverage < 80%"
    --cov-fail-under=0

# ============================================================
# MARKERS
# ============================================================
# Define custom markers to categorize tests
# Usage: @pytest.mark.slow to mark slow tests
# Run only unit tests: pytest -m unit
# Skip slow tests: pytest -m "not slow"

markers =
    # unit: Fast tests that don't require database or external services
    # Example: Testing a function that validates email format
    unit: Unit tests (fast, no external dependencies)
    
    # integration: Tests that use database, external APIs, etc.
    # Example: Testing user registration flow with database
    integration: Integration tests (slower, may need database)
    
    # slow: Tests that take more than 1 second
    # Example: Testing file upload with large file
    slow: Tests that take a long time to run
    
    # auth: Tests related to authentication/authorization
    # Useful for: pytest -m auth (run only auth tests)
    auth: Authentication and authorization tests
    
    # api: Tests for API endpoints
    # Example: Testing POST /api/users endpoint
    api: API endpoint tests

# ============================================================
# TEST ENVIRONMENT
# ============================================================
# env_files: Load environment variables from .env file for tests
# This ensures tests use test database, not production!
# Note: Requires pytest-dotenv plugin (pip install pytest-dotenv)
# env_files =
#     .env.test

# ============================================================
# CONSOLE OUTPUT
# ============================================================
# console_output_style: How test progress is displayed
# Options: classic, progress, count
# classic: Traditional format with dots (.)
# progress: Shows percentage complete
console_output_style = progress

# ============================================================
# WARNINGS
# ============================================================
# filterwarnings: Control which warnings are shown
# error: Treat warnings as errors (strict mode)
# ignore: Suppress specific warnings

filterwarnings =
    # Treat most warnings as errors to catch issues early
    error
    
    # Ignore deprecation warnings from third-party libraries
    # (You can't fix them, they're in external packages)
    ignore::DeprecationWarning:flask.*
    ignore::DeprecationWarning:sqlalchemy.*

# ============================================================
# EXAMPLE USAGE
# ============================================================
# Run all tests:
#   pytest
#
# Run tests in specific file:
#   pytest tests/unit/test_models.py
#
# Run specific test function:
#   pytest tests/unit/test_models.py::TestUserModel::test_creation
#
# Run tests with specific marker:
#   pytest -m unit          # Only unit tests
#   pytest -m "not slow"    # Skip slow tests
#   pytest -m "unit and auth"  # Unit tests that are auth-related
#
# Run tests matching pattern:
#   pytest -k "user"        # Run tests with "user" in the name
#   pytest -k "test_create or test_update"  # Tests matching either pattern
#
# Stop on first failure:
#   pytest -x
#
# Show local variables on failure:
#   pytest -l
#
# Run last failed tests only:
#   pytest --lf
#
# Run tests in parallel (requires pytest-xdist):
#   pytest -n auto
# ============================================================
